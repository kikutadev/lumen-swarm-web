<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumen Swarm — 通常樹木の根元</title>
<style>body{font:16px/1.5 system-ui;background:#101713;color:#ecf0e9;margin:0;padding:18px}main{max-width:1250px;margin:auto}p{color:#a9b4a9}figure{margin:0}img{width:100%;display:block}figcaption{padding:8px 0 20px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}a{color:#c5e8bd}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}h1{font-size:25px}@media(max-width:700px){section{grid-template-columns:1fr}}</style></head><body><main><header><h1>通常樹木の根元 — 修正前後</h1><a href="../">森林画質比較に戻る</a></header>
<p>Unityの同一カメラで撮影。大木の原本は変更せず、通常樹木のメッシュをBlenderで編集。尖った根先を短くして幹の自然な広がりを残し、地面への接地を再調整。</p>
<section><figure><img src="before.png" alt="修正前、太い根が地面に爪状に突き出す"><figcaption>修正前：根の先端が地面に触れるだけで、指のように突き出す</figcaption></figure><figure><img src="after.png" alt="修正後、根元が地面に収まり、低い下草が馴染む"><figcaption>修正後：Blenderで根先を短縮して再造形、地表への接地と下草も調整</figcaption></figure></section>
<p>通常樹木は高画質版185本／WebGL版77本の接地を調整。独立QAで有効な幹コライダー54本の接地を確認。世界樹の制作データは変更していません。</p></main></body></html>
