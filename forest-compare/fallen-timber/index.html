<h1>Blender制作の朽ちた倒木</h1>
<p>通常の森林に配置する約8.7mの倒木。幹の曲がりと破断端をBlenderの実メッシュとして制作し、同じ無料森林素材から樹皮・苔の質感を調整。世界樹の造形とは独立しています。</p>
<p><strong>法線修正前 → 修正後（別カメラで接地と全体を確認）</strong></p>
<div class="photos">
<figure><img src="before.png" alt="以前の外側面が消えた、船の底に見える倒木"><figcaption>修正前：樹皮の面が裏向きで消失</figcaption></figure>
<figure><img src="high.png" alt="面が修正されて立体的な丸太に見える倒木"><figcaption>修正後：幹の厚みと樹皮が正常に表示。周囲の植生も再配置</figcaption></figure>
</div>
<p>Blender原本・木口の近景・2つの画質</p>
<div class="photos">
<figure><img src="blender.png" alt="Blenderの斜め視点。曲がった幹と割れた端面"><figcaption>Blender原本・斜め視点</figcaption></figure>
<figure><img src="profile.png" alt="Blenderの横視点"><figcaption>Blender原本・横視点</figcaption></figure>
<figure><img src="web.png" alt="Unity WebGL版の倒木と林床"><figcaption>Unity WebGL版・984三角形</figcaption></figure>
<figure><img src="high.png" alt="Unity高画質版の倒木と林床"><figcaption>Unity高画質Mac版・5,460三角形</figcaption></figure>
<figure><img src="end-web.png" alt="Unity WebGL版の破断面と林床"><figcaption>WebGL版・破断面と林床</figcaption></figure>
<figure><img src="end-high.png" alt="Unity高画質版の破断面の立体的な造形"><figcaption>高画質版・破断面と林床</figcaption></figure>
</div><p>裏向きだった樹皮の面を修正し、木口を再造形。見た目だけでなく衝突形状も実装し、木には登れない設定です。木口の尖りと地面への食い込みも調整済み。この倒木は森林全体のうち一つの背景要素であり、ワールド全体の完成を意味しません。<a href="../play/">WebGL版で遊ぶ</a></p>
