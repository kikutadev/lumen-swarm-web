<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumen Swarm — 通常樹木の形状バリエーション</title><style>body{font:16px/1.55 system-ui;background:#111912;color:#e4ecde;margin:0;padding:18px}main{max-width:1160px;margin:auto}h1{font-size:26px}p{color:#b1bdaf}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}figure{margin:0}img{width:100%;display:block;border-radius:6px}figcaption{margin:10px 0}a{color:#b5e5ad}@media(max-width:800px){.gallery{grid-template-columns:1fr}}</style></head><body><main><h1>通常樹木の3形状</h1><p>無料森林パックの同一樹木をBlenderで個別にメッシュ変形。枝・葉・根元を含む各LODは共通のUV・材質構成。既存樹木の位置は維持し、シルエットを3タイプに振り分けました。</p><div class="gallery"><figure><img src="upright.png" alt="元の通常樹木、根元を加工した形状"><figcaption><strong>基本形</strong> ― 根元を調整した立木</figcaption></figure><figure><img src="windward.png" alt="横に傾き、縦に細長い樹冠の木"><figcaption><strong>傾斜形</strong> ― 幹と樹冠を傾けた立木</figcaption></figure><figure><img src="wide.png" alt="低く幅広い樹冠の木"><figcaption><strong>広冠形</strong> ― 横に広がる立木</figcaption></figure></div><p>Blenderレンダリングは形状比較用。Unityでは元の森林パックと同じ樹皮・葉素材を使用。実際のプレイ画面は<a href="../play/">WebGL版</a>、全体比較は<a href="../">森林画質比較ページ</a>で確認できます。</p></main></body></html>
