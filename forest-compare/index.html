<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen Swarm | 森林画質比較</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#101612;color:#e8ede3}
main{max-width:1320px;margin:auto;padding:24px}
h1{font-size:clamp(22px,3vw,30px);margin:0 0 6px}
p{color:#aebaac;margin:10px 0 16px}
button{background:transparent;color:inherit;border:1px solid #627463;border-radius:5px;padding:8px 12px;cursor:pointer}
button[aria-pressed=true]{background:#d7e2d0;color:#142016}
.head,.selectors{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.selectors{padding:8px 0 18px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pair figure{margin:0;min-width:0}
.pair img,.overlay img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#050c09}
.pair figcaption{padding:8px 0}
.small{font-size:13px;color:#aebaac}
.overlay{display:none}
.stack{position:relative;aspect-ratio:16/9;overflow:hidden}
.stack img{position:absolute;inset:0}
.stack .web{clip-path:inset(0 50% 0 0)}
.line{position:absolute;top:0;bottom:0;left:50%;width:2px;background:white;box-shadow:0 0 2px #101612}
.control{display:flex;align-items:center;gap:16px;margin-top:12px}
.control input{flex:1;accent-color:#c5d8bc}
.bottom{border-top:1px solid #334232;margin-top:22px;padding-top:14px}
a{color:#c5e8bd}
@media(max-width:700px){main{padding:16px}.pair{grid-template-columns:1fr}.selectors{gap:6px}button{padding:7px 10px}}
</style></head><body>
<main>
<div class="head"><h1>Lumen Swarm / 森林画質比較</h1><a href="play/">WebGL版をプレイする</a></div>
<p>同じ無料の森林素材と地形を使用。樹木密度・LOD・影・テクスチャ品質だけを切り替えています。</p>
<div class="selectors">
  <div aria-label="撮影視点"><button id="valley" aria-pressed="true">谷の中から</button> <button id="entrance" aria-pressed="false">出発地点から</button></div>
  <div aria-label="比較方式"><button id="side" aria-pressed="true">左右比較</button> <button id="over" aria-pressed="false">重ねて比較</button></div>
</div>
<section class="pair" id="pair">
<figure><img id="image-web" src="valley-web.png" alt="WebGL向け森林"><figcaption>WebGL軽量版 <span class="small">密度・LOD・影を抑制</span></figcaption></figure>
<figure><img id="image-high" src="valley-high.png" alt="Mac高画質向け森林"><figcaption>Mac高画質版 <span class="small">植生・影・描画距離を強化</span></figcaption></figure>
</section>
<section class="overlay" id="overlay">
  <div class="stack"><img id="overlay-high" src="valley-high.png" alt="高画質版"><img class="web" id="overlay-web" src="valley-web.png" alt="WebGL版"><div class="line" id="line"></div></div>
  <div class="control"><span>WebGL</span><input type="range" id="range" min="0" max="100" value="50" aria-label="比較境界"><span>高画質</span></div>
</section>
<p class="small bottom">Unity Editorの同位置静止画。実際のWISP操作やFPSは上のWebGL版で確認できます。現在は森林エリアの制作試作で、本番完成版ではありません。</p>
</main>
<script>
const $=id=>document.getElementById(id);
let valley=true;
function view(v){
 valley=v;
 const w=v?'valley-web.png':'web.png',h=v?'valley-high.png':'high.png';
 $('image-web').src=w;$('image-high').src=h;$('overlay-web').src=w;$('overlay-high').src=h;
 $('valley').setAttribute('aria-pressed',String(v));$('entrance').setAttribute('aria-pressed',String(!v));
}
function mode(o){
 $('pair').style.display=o?'none':'grid';$('overlay').style.display=o?'block':'none';
 $('side').setAttribute('aria-pressed',String(!o));$('over').setAttribute('aria-pressed',String(o));
}
$('valley').onclick=()=>view(true);$('entrance').onclick=()=>view(false);
$('side').onclick=()=>mode(false);$('over').onclick=()=>mode(true);
$('range').oninput=e=>{
 const v=Number(e.target.value);
 $('overlay-web').style.clipPath='inset(0 '+(100-v)+'% 0 0)';
 $('line').style.left=v+'%';
};
</script></body></html>
