<h1>Lumen Swarm / 巨木の造形レビュー</h1>
<p>制作中のBlenderスカルプト比較です。<strong>どちらも未採用です。</strong> V4は上側の樹冠を低くし、主枝を再変形、細枝の接続を修正しました。素材の光・地面・カメラが完全一致する前後比較ではありません。</p>
<h2>全体シルエットと樹皮</h2><div class="row"><figure><img src="v3-overview.png" alt="巨木V3の外観"><figcaption>V3 / 旧スカルプト</figcaption></figure><figure><img src="v4-overview.png" alt="巨木V4の外観"><figcaption>V4 / 樹冠の低下・枝の接合修正</figcaption></figure></div>
<h2>幹の腐朽部</h2><div class="row"><figure><img src="v3-detail.png" alt="V3腐朽部"><figcaption>V3 / 以前の腐朽部</figcaption></figure><figure><img src="v4-detail.png" alt="V4腐朽部"><figcaption>V4 / 内側の材質を分離。ただし立体感は未完成</figcaption></figure></div>
<h2>造形のみの確認</h2><figure style="max-width:780px"><img src="v4-clay.png" alt="V4の無地造形"><figcaption>V4のClayレンダリング。材質で隠さずシルエットを見るためのもの</figcaption></figure>
<aside><small>Blenderの編集可能な原本は pj/game/lumen-swarm/Art/ForestHero/RootGateV4/ に保存。現行のUnity森林とWebGL公開ゲームはこの試作で変更していません。</small></aside>
