<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#071c23">
    <style>
      html,body {margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#071c23;
        touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
        -webkit-touch-callout:none;}
      #unity-canvas {display:block;position:fixed;inset:0;width:100vw!important;
        height:100dvh!important;touch-action:none;outline:none;}
      #loading {position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
        background:#071c23;color:#d5fff5;font:600 14px system-ui,sans-serif;letter-spacing:.06em;}
      #loading > div {width:min(320px,80vw);text-align:center;}
      #load-track {height:5px;border-radius:3px;background:#244b50;margin:16px 0 10px;overflow:hidden;}
      #load-bar {height:100%;width:0%;background:#9dffe4;transition:width .16s ease;}
      #load-status {font-size:11px;font-weight:400;letter-spacing:0;color:#a1c4bf;line-height:1.6;}
      #retry {display:none;margin:18px auto 0;padding:11px 23px;border:1px solid #69b8a4;
        border-radius:8px;background:#123839;color:#e0fff6;font:600 14px system-ui;cursor:pointer;}
    </style>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23071c23%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2220%22%20fill%3D%22none%22%20stroke%3D%22%2366ebd3%22%20stroke-width%3D%223%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%225%22%20fill%3D%22%23eafff8%22%2F%3E%3Cpath%20d%3D%22M10%2040%20Q32%2010%2054%2032%22%20stroke%3D%22%238cfce8%22%20fill%3D%22none%22%20stroke-width%3D%222%22%2F%3E%3C%2Fsvg%3E">
    <title>Lumen Swarm</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <div id="loading" role="status" aria-live="polite"><div>
      <div>LUMEN SWARM</div><div id="load-track"><div id="load-bar"></div></div>
      <div id="load-status">読み込み中…</div>
      <button id="retry" type="button" onclick="location.replace(location.pathname+'?retry='+Date.now())">再読み込み</button>
    </div></div>
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style="width: 960px; height: 600px; background: #1F1F20"></canvas>
    <script src="Build/ac0659f705cf15c7283e3b77d7a6105f.loader.js"></script>
    <script>
      // CSS manages viewport-fit and full-screen canvas on every device.
      // Do not append a second viewport meta tag: Safari's safe-area can break.
      // No page scrolling, double-tap zoom, context menu or pinch during combat.
      const gameCanvas=document.querySelector("#unity-canvas");
      gameCanvas.addEventListener("contextmenu",e=>e.preventDefault());
      for (const name of ["touchstart","touchmove"])
        gameCanvas.addEventListener(name,e=>{ if(e.cancelable)e.preventDefault(); },
          {passive:false});
      document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
      const loading=document.getElementById('loading');
      const status=document.getElementById('load-status');
      if (!document.createElement('canvas').getContext('webgl2')) {
        status.textContent='WebGL 2 is required to play on this browser.';
        throw new Error('WebGL 2 is unavailable');
      }
      createUnityInstance(gameCanvas, {
        arguments: [],
        dataUrl: "Build/f16716ed292508f528d1a065111c2a6a.data.unityweb",
        frameworkUrl: "Build/a1066489ddd875ef6a7e152788e4b503.framework.js.unityweb",
        codeUrl: "Build/1d7b04260c2933546850acd11f347cc0.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Lumen Swarm Prototype",
        productName: "Lumen Swarm Lab",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        devicePixelRatio: (/iPhone|iPad|Android/i.test(navigator.userAgent) ? 1 : window.devicePixelRatio || 1),
      }, progress => {
        const pct=Math.max(0,Math.min(100,Math.round(progress*100)));
        document.getElementById('load-bar').style.width=pct+'%';
        status.textContent='Loading game… '+pct+'%';
      }).then((unityInstance) => {
        loading.remove();
        gameCanvas.focus();
      }).catch((message) => {
        // Keep the raw WASM stack in developer tools, not a full-screen wall
        // of addresses. Failed starts should offer a usable recovery path.
        console.error('Lumen Swarm startup error:',message);
        status.textContent='起動できませんでした。ほかのタブを閉じて再読み込みしてください。';
        document.getElementById('retry').style.display='block';
      });
    </script>
  </body>
</html>
