<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#071c23">
    <style>
      html,body {margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#071c23;
        touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
        -webkit-touch-callout:none;}
      #unity-canvas {display:block;position:fixed;inset:0;width:100vw!important;
        height:100dvh!important;touch-action:none;outline:none;}
    </style>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Lumen Swarm</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style="width: 960px; height: 600px; background: #1F1F20"></canvas>
    <script src="Build/LumenSwarmWeb.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";

      }

      // No page scrolling, double-tap zoom, context menu or pinch during combat.
      const gameCanvas=document.querySelector("#unity-canvas");
      gameCanvas.addEventListener("contextmenu",e=>e.preventDefault());
      for (const name of ["touchstart","touchmove"])
        gameCanvas.addEventListener(name,e=>{ if(e.cancelable)e.preventDefault(); },
          {passive:false});
      document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
      createUnityInstance(gameCanvas, {
        arguments: [],
        dataUrl: "Build/LumenSwarmWeb.data.unityweb",
        frameworkUrl: "Build/LumenSwarmWeb.framework.js.unityweb",
        codeUrl: "Build/LumenSwarmWeb.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Lumen Swarm Prototype",
        productName: "Lumen Swarm",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        devicePixelRatio: (/iPhone|iPad|Android/i.test(navigator.userAgent) ? 1 : window.devicePixelRatio || 1),
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
